name: release

# A tag `vX.Y.Z` publishes a GitHub release: only when the tag matches the version in
# .claude-plugin/plugin.json and every CI job passes on the tagged commit. The notes are the
# matching section of CHANGELOG.md. Users on the marketplace get the new version when they run
# `claude plugin update agent-memory@agent-memory` (or with auto-update on).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: tag matches plugin.json, notes from CHANGELOG
        run: uv run --no-project --python 3.12 tools/release_notes.py --tag "$GITHUB_REF_NAME" --out notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "agent-memory $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
